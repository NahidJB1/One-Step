<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | One Step</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #0066CC;
            --primary-light: #00C2FF;
            --secondary: #0A192F;
            --accent: #FFD700;
            --bg-color: #050b14;
            --text-main: #F8FAFC;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(0, 102, 204, 0.15) 0%, rgba(0, 194, 255, 0.05) 40%, rgba(5, 11, 20, 0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: pulseGlow 8s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* Particles */
        .particles-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: var(--primary-light);
            border-radius: 50%;
            opacity: 0.3;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Main Content Container */
        .content-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* The 404 Text */
        .error-code {
            font-size: clamp(8rem, 20vw, 15rem);
            font-weight: 800;
            line-height: 1;
            margin: 0;
            background: linear-gradient(135deg, var(--text-main) 0%, var(--primary-light) 50%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            text-shadow: 0 20px 40px rgba(0, 102, 204, 0.2);
            z-index: 2;
        }

        /* Interactive SVG Compass/Path Element */
        .interactive-svg-container {
            width: 200px;
            height: 200px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            opacity: 0.15;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .living-logo {
            width: 100%;
            height: 100%;
            animation: slowSpin 20s linear infinite;
        }

        @keyframes slowSpin {
            100% { transform: rotate(360deg); }
        }

        /* Typography */
        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: -1px;
            color: var(--text-main);
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 500px;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Glowing Button */
        .btn-home {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--bg-color);
            background: var(--text-main);
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 102, 204, 0.2);
            gap: 12px;
        }

        .btn-home::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transition: all 0.5s ease;
        }

        .btn-home:hover {
            transform: translateY(-5px);
            background: var(--primary-light);
            color: var(--bg-color);
            box-shadow: 0 15px 30px rgba(0, 194, 255, 0.4);
        }

        .btn-home:hover::before {
            left: 100%;
        }

        .btn-home i {
            transition: transform 0.3s ease;
        }

        .btn-home:hover i {
            transform: translateX(-5px);
        }

        /* Floating elements for visual interest */
        .float-obj {
            position: absolute;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            animation: float 6s ease-in-out infinite;
            z-index: 5;
        }
        
        .obj-1 { top: 15%; left: 10%; width: 120px; height: 120px; animation-delay: 0s; transform: rotate(15deg); }
        .obj-2 { bottom: 15%; right: 10%; width: 150px; height: 100px; animation-delay: 2s; transform: rotate(-10deg); border-radius: 50%; }
        .obj-3 { top: 20%; right: 20%; width: 60px; height: 60px; animation-delay: 1s; transform: rotate(45deg); }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @media (max-width: 768px) {
            .float-obj { display: none; }
        }
    </style>
</head>
<body>

    <!-- Ambient Background -->
    <div class="ambient-glow"></div>

    <!-- Parallax Floating Glass Objects -->
    <div class="float-obj obj-1 parallax" data-speed="0.05"></div>
    <div class="float-obj obj-2 parallax" data-speed="-0.03"></div>
    <div class="float-obj obj-3 parallax" data-speed="0.08"></div>

    <!-- Particle System -->
    <div class="particles-container" id="particles"></div>

    <!-- Main Content -->
    <div class="content-wrapper">
        
        <!-- Interactive Compass / Path behind the 404 -->
        <div class="interactive-svg-container parallax" data-speed="-0.1">
            <svg class="living-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="48" stroke="url(#paint0_linear)" stroke-width="2" stroke-dasharray="10 5" />
                <path d="M30 70L50 50L70 30" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" />
                <path d="M30 40L50 20L70 40" stroke="var(--primary-light)" stroke-width="4" stroke-linecap="round" />
                <defs>
                    <linearGradient id="paint0_linear" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#0066CC" />
                        <stop offset="1" stop-color="#00C2FF" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="error-code parallax" data-speed="0.08">404</div>
        <h1 class="parallax" data-speed="0.04">One step off the path...</h1>
        <p class="parallax" data-speed="0.02">It seems the page you're looking for has wandered off. Don't worry, even the best explorers take a wrong turn sometimes.</p>
        
        <a href="https://www.onestepmy.com/" class="btn-home parallax" data-speed="0.06">
            <i class="fas fa-arrow-left"></i>
            Take Me Back Home
        </a>
    </div>

    <!-- Scripts for Interactions -->
    <script>
        // Generate Particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Random properties
            const size = Math.random() * 4 + 1 + 'px';
            const left = Math.random() * 100 + '%';
            const duration = Math.random() * 15 + 10 + 's';
            const delay = Math.random() * -20 + 's';
            
            particle.style.width = size;
            particle.style.height = size;
            particle.style.left = left;
            particle.style.animationDuration = duration;
            particle.style.animationDelay = delay;
            
            particlesContainer.appendChild(particle);
        }

        // Mouse Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const parallaxElements = document.querySelectorAll('.parallax');
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;

            parallaxElements.forEach(el => {
                const speed = parseFloat(el.getAttribute('data-speed'));
                el.style.transform = `translateX(${x * speed * 100}px) translateY(${y * speed * 100}px)`;
            });
        });
    </script>
</body>
</html>
