<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Taylor's University – International Fee Structure 2026</title> 
  <link rel="stylesheet" href="../assets/css/fees.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-uni-id="taylors">

<header>
  <div class="header-content">
    <div class="logo-container"></div>
    <div class="header-text"></div>
    <div class="logo-container">
      <svg class="living-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle class="step-circle" cx="50" cy="50" r="48" stroke="#0066CC" stroke-width="4" />
        <path class="step-line" d="M30 70L50 50L70 30" stroke="#FFD700" stroke-width="8" stroke-linecap="round" />
        <path class="step-arrow" d="M30 40L50 20L70 40" stroke="#00C2FF" stroke-width="6" stroke-linecap="round" />
        <rect class="step-block" x="40" y="60" width="20" height="10" rx="2" fill="#0066CC" />
      </svg>
    </div>
  </div>
</header>

<div class="container">
  <div class="search-container">
    <div class="search-box-wrapper">
      <input type="text" id="searchInput" placeholder="Search for a program (e.g. Engineering, Architecture)..." />
      <button class="search-icon-btn"> &#128269; </button>
    </div>
  </div>

  <div id="dynamicFeesContainer">
      <div style="padding: 40px; text-align: center; color: #64748b;">
          <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 10px;"></i>
          <p>Loading fee structures...</p>
      </div>
  </div>

  <div class="view-details-btn-container" style="margin-top: 50px;">
    <a href="../Universities/taylors-details.html" class="view-details-btn">
      <i class="fas fa-arrow-left"></i>
      Check University Details
    </a>
  </div>
</div>

<div id="global-footer-placeholder"></div>

<script src="../assets/js/footer.js"></script>
<script src="../assets/js/fees.js"></script>
</body>
</html>
