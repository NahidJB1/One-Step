<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="Register and submit your application to study in Malaysia. One Step MY simplifies your university journey.">
  <link rel="canonical" href="https://www.onestepmy.com/application.html">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start Your Application | One Step MY</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <link rel="stylesheet" href="assets/css/index.css">
  <link rel="stylesheet" href="assets/css/application.css">
</head>
<body>

  <div id="global-nav-placeholder"></div>

  <section class="app-section">
    <div class="container">
      <div class="app-card">
        
        <div class="app-header">
          <h2>Student Application</h2>
          <p>Take the first step towards your dream education.</p>
        </div>

        <form id="applicationForm" class="app-form">
          
          <div class="form-section">
            <h3 class="section-heading"><i class="fas fa-user"></i> Personal Details</h3>
            
            <div class="form-group">
              <label for="fullName">Full Name <span class="sub-label">(As per Passport)</span></label>
              <input type="text" id="fullName" name="fullName" placeholder="e.g. Bhuiyan Mohamed..." required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="phone">Phone Number</label>
                <div class="input-with-icon">
                  <i class="fas fa-phone-alt"></i>
                  <input type="tel" id="phone" name="phone" placeholder="+60 123..." required>
                </div>
              </div>
              
              <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-with-icon">
                  <i class="fas fa-envelope"></i>
                  <input type="email" id="email" name="email" placeholder="student@example.com" required>
                </div>
              </div>
            </div>
          </div>

          <div class="form-section">
            <h3 class="section-heading"><i class="fas fa-graduation-cap"></i> Academic Profile</h3>

            <div class="form-group">
              <label for="eduQualification">Education Qualification</label>
              <select id="eduQualification" name="eduQualification" required>
                <option value="" disabled selected>Select your highest qualification</option>
                <option value="SSC">SSC / O-Level</option>
                <option value="HSC">HSC / A-Level</option>
                <option value="Diploma">Diploma</option>
                <option value="Bachelor">Bachelor's Degree</option>
                <option value="Master">Master's Degree</option>
                <option value="PhD">PhD</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group hidden-input" id="otherEduGroup">
              <label for="otherEdu">Please specify qualification</label>
              <input type="text" id="otherEdu" name="otherEdu" placeholder="Enter your qualification">
            </div>

            <div class="form-group">
              <label for="studyInterest">Interested to Study</label>
              <input type="text" id="studyInterest" name="studyInterest" placeholder="e.g. Computer Science, Business, Engineering..." required>
            </div>
          </div>

          <div class="form-section">
            <h3 class="section-heading"><i class="fas fa-passport"></i> Passport Status</h3>
            <label class="passport-label">Do you have a valid passport?</label>
            
            <div class="passport-options">
              <label class="radio-card">
                <input type="radio" name="passportStatus" value="Yes" required>
                <span class="radio-content">
                  <i class="fas fa-check-circle"></i>
                  <span>Yes, I do</span>
                </span>
              </label>

              <label class="radio-card">
                <input type="radio" name="passportStatus" value="No">
                <span class="radio-content">
                  <i class="fas fa-times-circle"></i>
                  <span>No, not yet</span>
                </span>
              </label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary submit-btn">
            Submit Application <i class="fas fa-paper-plane"></i>
          </button>

        </form>
      </div>
    </div>
  </section>

  <div id="global-footer-placeholder"></div>

  <div id="successModal" class="modal-overlay">
    <div class="modal-content">
      <div class="success-icon-box">
        <i class="fas fa-check"></i>
      </div>
      <h3>Application Submitted!</h3>
      <p>We have received your details. Our counselors will contact you shortly.</p>
      <button class="btn btn-primary close-modal-btn">Close</button>
    </div>
  </div>

  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="assets/js/application.js"></script>
</body>
</html>
